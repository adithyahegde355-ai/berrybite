name: Build BerryBite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android Native Scaffold
        run: flutter create . --platforms=android --org com.berrybite.app

      - name: Add Internet permission
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $f || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' $f

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (shows real Dart errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: |
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log || (grep -nE "Error|error:|lib/.*dart" build.log | head -30; exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: berrybite-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
